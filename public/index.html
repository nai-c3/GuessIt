<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0d1a3a">
  <title>GUESS IT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <canvas class="snow" id="snow"></canvas>
  <div class="offline-banner hidden" id="offline">Verbindung getrennt – verbinde neu…</div>

  <main class="player">
    <header>
      <div class="logo"><span class="g">Guess</span><span class="i">it</span></div>
      <div class="me-chip hidden" id="meChip"></div>
    </header>
    <div class="progress hidden" id="progress">
      <span id="progressLabel">Frage 1 / 12</span>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>

    <div id="view"></div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/common.js"></script>
  <script src="/player.js"></script>
</body>
</html>
